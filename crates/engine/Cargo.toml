[package]
name = "rstex-engine"
description = "The rstex engine: a port of pdfTeX"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# src/main.rs is the module for Parts 51-52, not a binary.
autobins = false

[lib]
path = "src/lib.rs"

[features]
# Every array index is bounds-checked: TRIP runs on such a build, `cargo build --release -p rstex --features rstex-engine/checked --target-dir target/checked`, then tests/trip/compare_trip.py target/checked/release/rstex; see DESIGN.md section 4.
checked = []
# Keep the generic token paths where capture loops would apply, for differential testing.
slow_capture = []
# The token heap's bump space ends soon after what a format holds, so that an ordinary document gets to tok_reclaim, for differential testing.
tight_heap = []
# Compiles the two timing loops, hash::tests::lookup_speed and getnext::tests::token_list_speed, which are not tests.
timing = []
# VERSION_STRING is the oracle's, so that no output differs by the banner: `cargo build --release -p rstex --features rstex-engine/oracle-banner --target-dir target/oracle-banner`, then tests/corpus/run.py compare, whose L6 line must count none 'equal but for the version string'.  Never in a shipped build.
oracle-banner = []
# The sampler, counters and phases of tools/prof/.  Never in a shipped build: see src/prof.rs.
prof = ["rstex-kpse/prof"]
# `\message{rstexprobe NAME}` dumps eqtb and the registers, to establish what a real diagram changes: src/native_probe.rs.  Never in a shipped build.
commute-probe = []

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dependencies]
rstex-kpse.workspace = true
rstex-fontfile.workspace = true
rstex-pdfio.workspace = true
rstex-image.workspace = true
commute.workspace = true
