[package]
name = "rstex"
description = "A TeX-to-PDF compiler in Rust, pdflatex compatible"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "rstex_driver"
path = "src/lib.rs"

[[bin]]
name = "rstex"
path = "src/main.rs"

[features]
# The profiler of tools/prof/.  Never in a shipped build.
prof = ["rstex-engine/prof"]

[dependencies]
rstex-engine.workspace = true
rstex-kpse.workspace = true
