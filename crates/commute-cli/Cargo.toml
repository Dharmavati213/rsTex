[package]
name = "commute-cli"
description = "The commute command: tightly cropped PDF and SVG of tikz-cd diagrams"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "commute"
path = "src/main.rs"

[features]
# The profiler of tools/prof/.  Never in a shipped build.
prof = ["rstex/prof"]

[dependencies]
commute.workspace = true
rstex = { path = "../rstex" }
rstex-engine.workspace = true
rstex-kpse.workspace = true
