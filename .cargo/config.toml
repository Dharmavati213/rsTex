# DESIGN.md section 8: static C runtime, 0.38 vs 0.75 ms exec, and it skips the system ld.so.preload.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

# DESIGN.md section 12.  macOS cannot be static.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
